<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 | Page Not Found - HomeVault</title>

    <link
        rel="icon"
        type="image/png"
        href="logo.png"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>


    <style>

        :root {

            --font-family: "Manrope", sans-serif;

            --primary: #123B5D;
            --primary-dark: #0B263D;

            --secondary: #16A6A1;
            --secondary-dark: #0F817D;

            --bg-color: #F6F9FB;
            --text-color: #17212B;

            --card-bg: #FFFFFF;
            --border-color: #D9E2E8;

            --primary-light: rgba(18, 59, 93, 0.12);
            --secondary-light: rgba(22, 166, 161, 0.12);

            --heading-color: #102A43;
            --text-light: #64748B;

        }


        body.dark {

            --bg-color: #0D1720;
            --text-color: #E8EEF2;

            --card-bg: #14232E;
            --border-color: #29404D;

            --primary: #3B82C4;
            --primary-dark: #256A9C;

            --secondary: #20C4BE;
            --secondary-dark: #0F817D;

            --primary-light: rgba(59, 130, 196, 0.18);
            --secondary-light: rgba(32, 196, 190, 0.15);

            --heading-color: #F4F8FA;
            --text-light: #9BAFBB;

        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family: var(--font-family);

            background: var(--bg-color);

            color: var(--text-color);

            overflow: hidden;

            transition:
                background 0.35s ease,
                color 0.35s ease;

        }


        .error-page {

            position: relative;

            width: 100%;
            height: 100vh;
            min-height: 600px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            overflow: hidden;

        }


        .error-controls {

            position: fixed;

            top: 22px;
            right: 24px;

            display: flex;
            align-items: center;

            gap: 8px;

            z-index: 50;

        }


        .error-control {

            height: 42px;
            min-width: 42px;

            padding: 0 13px;

            border: 1px solid var(--border-color);

            border-radius: 10px;

            background: var(--card-bg);

            color: var(--heading-color);

            font-family: var(--font-family);

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 8px 24px rgba(18, 59, 93, 0.08);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;

        }


        .error-control:hover {

            transform: translateY(-2px);

            border-color: var(--secondary);

        }


        .theme-button svg {

            width: 18px;
            height: 18px;

        }


        .background-shape {

            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(2px);

            opacity: 0.55;

        }


        .background-shape-one {

            width: 420px;
            height: 420px;

            top: -180px;
            left: -120px;

            background:
                radial-gradient(
                    circle,
                    rgba(22,166,161,0.18),
                    transparent 68%
                );

            animation: floatShapeOne 9s ease-in-out infinite;

        }


        .background-shape-two {

            width: 500px;
            height: 500px;

            right: -190px;
            bottom: -220px;

            background:
                radial-gradient(
                    circle,
                    rgba(18,59,93,0.16),
                    transparent 68%
                );

            animation: floatShapeTwo 11s ease-in-out infinite;

        }


        .background-line {

            position: absolute;

            width: 700px;
            height: 700px;

            border: 1px solid var(--secondary);

            border-radius: 50%;

            opacity: 0.055;

            pointer-events: none;

            animation: rotateLine 25s linear infinite;

        }


        .background-line-two {

            width: 520px;
            height: 520px;

            animation-duration: 19s;

            animation-direction: reverse;

        }


        .documentation-card {

            position: absolute;

            width: 220px;

            padding: 17px;

            border: 1px solid var(--border-color);

            border-radius: 14px;

            background:
                color-mix(
                    in srgb,
                    var(--card-bg) 82%,
                    transparent
                );

            backdrop-filter: blur(12px);

            box-shadow:
                0 20px 55px rgba(18,59,93,0.08);

            opacity: 0.55;

            pointer-events: none;

        }


        .documentation-card-one {

            left: 7%;
            top: 22%;

            animation:
                documentFloatOne
                7s
                ease-in-out
                infinite;

        }


        .documentation-card-two {

            right: 7%;
            bottom: 22%;

            animation:
                documentFloatTwo
                8s
                ease-in-out
                infinite;

        }


        .documentation-card-header {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 13px;

        }


        .documentation-icon {

            width: 34px;
            height: 34px;

            border-radius: 9px;

            background: var(--secondary-light);

            color: var(--secondary);

            display: flex;

            align-items: center;
            justify-content: center;

        }


        .documentation-icon svg {

            width: 17px;
            height: 17px;

        }


        .documentation-card-header span {

            width: 75px;
            height: 7px;

            border-radius: 20px;

            background: var(--border-color);

        }


        .documentation-lines {

            display: grid;

            gap: 7px;

        }


        .documentation-lines span {

            display: block;

            height: 6px;

            border-radius: 20px;

            background: var(--border-color);

        }


        .documentation-lines span:nth-child(2) {
            width: 78%;
        }


        .documentation-lines span:nth-child(3) {
            width: 55%;
        }


        .error-content {

            position: relative;

            z-index: 10;

            width: 100%;
            max-width: 690px;

            text-align: center;

            animation:
                errorContentIn
                0.9s
                cubic-bezier(.22,1,.36,1)
                both;

        }


        .error-logo {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            margin-bottom: 38px;

            text-decoration: none;

            color: var(--primary);

        }


        .error-logo img {

            width: 45px;
            height: 45px;

            object-fit: contain;

        }


        .error-logo span {

            font-size: 21px;

            font-weight: 800;

            letter-spacing: -0.5px;

        }


        .error-logo span span {

            color: var(--secondary);

        }


        .error-number {

            position: relative;

            display: inline-block;

            margin-bottom: 5px;

            font-size: clamp(110px, 18vw, 190px);

            line-height: 0.8;

            font-weight: 800;

            letter-spacing: -12px;

            color: transparent;

            -webkit-text-stroke: 2px var(--primary);

            opacity: 0.95;

            animation:
                numberFloat
                5s
                ease-in-out
                infinite;

        }


        .error-number::after {

            content: "404";

            position: absolute;

            inset: 0;

            color: var(--secondary);

            opacity: 0.13;

            transform: translate(7px, 7px);

            z-index: -1;

        }


        .error-badge {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 7px 12px;

            margin-bottom: 17px;

            border-radius: 30px;

            background: var(--primary-light);

            color: var(--primary);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 0.5px;

            text-transform: uppercase;

        }


        .error-badge svg {

            width: 14px;
            height: 14px;

        }


        .error-content h1 {

            margin-bottom: 11px;

            color: var(--heading-color);

            font-size: clamp(27px, 4vw, 40px);

            line-height: 1.15;

            letter-spacing: -1.2px;

            font-weight: 800;

        }


        .error-content h1 span {

            color: var(--secondary);

        }


        .error-description {

            max-width: 520px;

            margin: 0 auto;

            color: var(--text-light);

            font-size: 14px;

            line-height: 1.7;

        }


        .error-actions {

            margin-top: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

        }


        .error-button {

            min-width: 145px;

            height: 46px;

            padding: 0 20px;

            border-radius: 10px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            text-decoration: none;

            font-family: var(--font-family);

            font-size: 12px;

            font-weight: 700;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;

        }


        .error-button svg {

            width: 16px;
            height: 16px;

        }


        .error-button-primary {

            color: #ffffff;

            background: var(--primary);

            box-shadow:
                0 10px 25px rgba(18,59,93,0.18);

        }


        .error-button-primary:hover {

            background: var(--secondary);

            transform: translateY(-2px);

            box-shadow:
                0 15px 32px rgba(18,59,93,0.24);

        }


        .error-button-secondary {

            color: var(--primary);

            background: transparent;

            border: 1px solid var(--primary);

        }


        .error-button-secondary:hover {

            background: var(--primary);

            border-color: var(--primary);

            transform: translateY(-2px);
            color:white;

        }


        .error-note {

            margin-top: 23px;

            color: var(--text-light);

            font-size: 10px;

            opacity: 0.85;

        }


        .error-note strong {

            color: var(--secondary);

        }


        @keyframes errorContentIn {

            from {

                opacity: 0;

                transform: translateY(35px) scale(0.97);

            }

            to {

                opacity: 1;

                transform: translateY(0) scale(1);

            }

        }


        @keyframes numberFloat {

            0%,
            100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-8px);

            }

        }


        @keyframes floatShapeOne {

            0%,
            100% {

                transform: translate(0,0);

            }

            50% {

                transform: translate(30px,25px);

            }

        }


        @keyframes floatShapeTwo {

            0%,
            100% {

                transform: translate(0,0);

            }

            50% {

                transform: translate(-30px,-20px);

            }

        }


        @keyframes rotateLine {

            from {

                transform: rotate(0deg);

            }

            to {

                transform: rotate(360deg);

            }

        }


        @keyframes documentFloatOne {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-4deg);

            }

            50% {

                transform:
                    translateY(-15px)
                    rotate(-2deg);

            }

        }


        @keyframes documentFloatTwo {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(4deg);

            }

            50% {

                transform:
                    translateY(15px)
                    rotate(2deg);

            }

        }


        @media (max-width: 1024px) {

            .error-page {
                padding: 25px;
            }

            .documentation-card-one {
                left: 2%;
            }

            .documentation-card-two {
                right: 2%;
            }

        }


        @media (max-width: 768px) {

            .error-page {
                min-height: 100svh;
                height: 100svh;

                padding: 20px;
            }

            .error-controls {
                top: 14px;
                right: 15px;
            }

            .error-control {
                height: 38px;
                min-width: 38px;
            }

            .documentation-card {
                opacity: 0.35;
                transform: scale(0.8);
            }

            .documentation-card-one {
                left: -70px;
                top: 20%;
            }

            .documentation-card-two {
                right: -70px;
                bottom: 18%;
            }

            .error-logo {
                margin-bottom: 22px;
            }

            .error-logo img {
                width: 40px;
                height: 40px;
            }

            .error-logo span {
                font-size: 19px;
            }

            .error-number {
                font-size: 125px;
                letter-spacing: -8px;
            }

            .error-content h1 {
                font-size: 30px;
            }

            .error-description {
                max-width: 470px;
                font-size: 12px;
            }

        }


        @media (max-width: 360px) {

            body {
                overflow: hidden;
            }

            .error-page {
                height: 100svh;
                min-height: 100svh;

                padding: 15px;
            }

            .error-controls {
                top: 8px;
                right: 8px;

                gap: 5px;
            }

            .error-control {
                height: 34px;
                min-width: 34px;

                padding: 0 9px;

                border-radius: 8px;

                font-size: 8px;
            }

            .theme-button svg {
                width: 15px;
                height: 15px;
            }

            .error-logo {
                margin-bottom: 18px;

                gap: 7px;
            }

            .error-logo img {
                width: 35px;
                height: 35px;
            }

            .error-logo span {
                font-size: 17px;
            }

            .error-number {
                margin-bottom: 4px;

                font-size: 105px;

                letter-spacing: -7px;

                -webkit-text-stroke-width: 1.5px;
            }

            .error-badge {
                padding: 6px 9px;

                margin-bottom: 12px;

                font-size: 8px;
            }

            .error-badge svg {
                width: 12px;
                height: 12px;
            }

            .error-content h1 {
                margin-bottom: 8px;

                font-size: 24px;

                letter-spacing: -0.7px;
            }

            .error-description {
                max-width: 300px;

                font-size: 10px;

                line-height: 1.55;
            }

            .error-actions {

                margin-top: 20px;

                width: 100%;

                flex-direction: column;

                gap: 8px;

            }

            .error-button {

                width: 100%;
                max-width: 280px;

                height: 40px;

                font-size: 10px;

                border-radius: 8px;

            }

            .error-button svg {

                width: 14px;
                height: 14px;

            }

            .error-note {

                margin-top: 15px;

                font-size: 8px;

            }

            .documentation-card {

                opacity: 0.18;

                transform: scale(0.55);

            }

            .documentation-card-one {

                left: -115px;
                top: 16%;

            }

            .documentation-card-two {

                right: -115px;
                bottom: 15%;

            }

            .background-line {

                width: 400px;
                height: 400px;

            }

            .background-line-two {

                width: 300px;
                height: 300px;

            }

            html[dir="rtl"] .error-controls {

                right: auto;
                left: 8px;

            }

        }


        html[dir="rtl"] .documentation-card-one {

            left: auto;
            right: 7%;

        }


        html[dir="rtl"] .documentation-card-two {

            right: auto;
            left: 7%;

        }


        @media (max-width: 768px) {

            html[dir="rtl"] .documentation-card-one {

                right: -70px;

            }

            html[dir="rtl"] .documentation-card-two {

                left: -70px;

            }

        }


        @media (max-width: 360px) {

            html[dir="rtl"] .documentation-card-one {

                right: -115px;

            }

            html[dir="rtl"] .documentation-card-two {

                left: -115px;

            }

        }


        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                scroll-behavior: auto !important;

            }

        }

    </style>

</head>


<body>


    <main class="error-page">


        <div class="background-shape background-shape-one"></div>

        <div class="background-shape background-shape-two"></div>


        <div class="background-line"></div>

        <div class="background-line background-line-two"></div>


        <div class="documentation-card documentation-card-one">

            <div class="documentation-card-header">

                <div class="documentation-icon">

                    <i data-lucide="camera"></i>

                </div>

                <span></span>

            </div>

            <div class="documentation-lines">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <div class="documentation-card documentation-card-two">

            <div class="documentation-card-header">

                <div class="documentation-icon">

                    <i data-lucide="file-check-2"></i>

                </div>

                <span></span>

            </div>

            <div class="documentation-lines">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <div class="error-controls">


            <button
                id="rtlToggle"
                class="error-control rtl-button"
                type="button"
            >
                RTL
            </button>


            <button
                id="themeToggle"
                class="error-control theme-button"
                type="button"
                aria-label="Toggle dark mode"
            >

                <i data-lucide="moon"></i>

            </button>


        </div>


        <section class="error-content">


            <a
                href="index.html"
                class="error-logo"
            >

                <img
                    src="logo.png"
                    alt="HomeVault"
                >

                <span>
                    Home<span>Vault</span>
                </span>

            </a>


            <div class="error-number">
                404
            </div>


            <div class="error-badge">

                <i data-lucide="file-question"></i>

                Page Not Found

            </div>


            <h1>

                This Record
                <span>Couldn’t Be Found.</span>

            </h1>


            <p class="error-description">

                The page you are looking for may have been moved,
                removed, or the address may be incorrect.
                Let's get you back to your HomeVault records.

            </p>


            <div class="error-actions">


                <a
                    href="index.html"
                    class="error-button error-button-primary"
                >

                    <i data-lucide="house"></i>

                    Back to Home

                </a>


                <a
                    href="contact.html"
                    class="error-button error-button-secondary"
                >

                    <i data-lucide="headphones"></i>

                    Contact Support

                </a>


            </div>


            <p class="error-note">

                Need help finding something?
                <strong>Our documentation team is here to help.</strong>

            </p>


        </section>


    </main>


    <script>

        const themeToggle =
            document.getElementById("themeToggle");


        const savedTheme =
            localStorage.getItem("theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

        }


        function updateThemeIcon() {

            if (!themeToggle) return;

            themeToggle.innerHTML =
                document.body.classList.contains("dark")
                    ? '<i data-lucide="sun"></i>'
                    : '<i data-lucide="moon"></i>';

            lucide.createIcons();

        }


        updateThemeIcon();


        if (themeToggle) {

            themeToggle.addEventListener(
                "click",
                () => {

                    document.body.classList.toggle("dark");

                    const isDark =
                        document.body.classList.contains("dark");


                    localStorage.setItem(
                        "theme",
                        isDark
                            ? "dark"
                            : "light"
                    );


                    updateThemeIcon();

                }
            );

        }


        const rtlToggle =
            document.getElementById("rtlToggle");


        const savedDirection =
            localStorage.getItem("direction") || "ltr";


        document.documentElement.setAttribute(
            "dir",
            savedDirection
        );


        if (rtlToggle) {

            rtlToggle.textContent =
                savedDirection === "rtl"
                    ? "LTR"
                    : "RTL";


            rtlToggle.addEventListener(
                "click",
                () => {

                    const currentDirection =
                        document.documentElement
                            .getAttribute("dir");


                    const newDirection =
                        currentDirection === "rtl"
                            ? "ltr"
                            : "rtl";


                    document.documentElement
                        .setAttribute(
                            "dir",
                            newDirection
                        );


                    localStorage.setItem(
                        "direction",
                        newDirection
                    );


                    rtlToggle.textContent =
                        newDirection === "rtl"
                            ? "LTR"
                            : "RTL";

                }
            );

        }


        lucide.createIcons();


        const errorNumber =
            document.querySelector(".error-number");


        if (errorNumber) {

            document.addEventListener(
                "mousemove",
                (event) => {

                    if (
                        window.innerWidth <= 768 ||
                        window.matchMedia(
                            "(prefers-reduced-motion: reduce)"
                        ).matches
                    ) {
                        return;
                    }


                    const x =
                        (event.clientX /
                            window.innerWidth -
                            0.5) * 8;


                    const y =
                        (event.clientY /
                            window.innerHeight -
                            0.5) * 8;


                    errorNumber.style.transform =
                        `translate(${x}px, ${y}px)`;

                }
            );

        }

    </script>

</body>

</html>
